<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course · Raviteja Mulukuntla</title>
  <meta name="description" content="Free video course by Raviteja Mulukuntla.">
  <meta name="theme-color" content="#060918">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>try{var t=localStorage.getItem("rm-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body data-page="courses">
  <div class="bg-fx" aria-hidden="true"><span class="orb o1"></span><span class="orb o2"></span></div>
  <header id="site-header"></header>

  <main class="container" id="course-root" style="padding-top:32px;padding-bottom:40px">
    <div class="skeleton" style="height:28px;width:240px;margin-bottom:20px"></div>
    <div class="course-layout">
      <div class="skeleton" style="aspect-ratio:16/9"></div>
      <div class="skeleton" style="height:420px"></div>
    </div>
  </main>

  <section class="section-sm" id="more-courses" hidden>
    <div class="container">
      <span class="eyebrow">Keep learning</span>
      <h2 class="h2" style="margin-bottom:32px">More courses</h2>
      <div class="course-grid" id="more-grid"></div>
    </div>
  </section>

  <footer id="site-footer"></footer>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/course.js"></script>
</body>
</html>
