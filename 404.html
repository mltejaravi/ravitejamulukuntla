<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Raviteja Mulukuntla</title>
  <meta name="theme-color" content="#060918">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#060918; --text:#eef1ff; --muted:#8b93b8; }
    @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg:#f5f6fc; --text:#0d1233; --muted:#646c92; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; text-align:center; padding:16px;
      font-family:"Plus Jakarta Sans",system-ui,sans-serif; background:var(--bg); color:var(--text); }
    h1 { font-size:clamp(90px,20vw,180px); margin:0; line-height:1; letter-spacing:-.05em;
      background:linear-gradient(120deg,#8b5cf6,#6366f1,#22d3ee); -webkit-background-clip:text; background-clip:text; color:transparent; }
    p { color:var(--muted); font-size:18px; }
    a { display:inline-block; margin-top:12px; padding:14px 26px; border-radius:999px; color:#fff; font-weight:700; text-decoration:none;
      background:linear-gradient(120deg,#8b5cf6,#6366f1,#22d3ee); }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>This page took a wrong turn. Let's get you back to learning.</p>
    <a href="/" id="home">Go to homepage</a>
  </div>
  <script>
    // On a project site (username.github.io/repo/) the homepage is /repo/, not /
    var seg = location.pathname.split("/")[1];
    if (location.hostname.endsWith("github.io") && seg) document.getElementById("home").href = "/" + seg + "/";
  </script>
</body>
</html>
